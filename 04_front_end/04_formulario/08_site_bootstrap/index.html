<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- css bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- meu css -->
    <link href="css/estilos.css" rel="stylesheet" type="text/css">

    <!-- favicon -->
    <link href="img/java-white-50.png" rel="shortcut icon" type="image/png">
</head>

<body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-dark sombra-navbar border-bottom" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/java-white-50.png" alt="Ícone" class="meu-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Cadastro</a>
                    </li>

                </ul>
               
            </div>
        </div>
    </nav>
    <!-- fim do navbar -->
<!--Carrosel-->
<div id="carouselExampleCaptions" class="carousel slide
    sombra-carousel" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3" aria-label="Slide 4"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="img/img1.jpg" class="d-block w-100" alt="img1">
        <div class="carousel-caption d-none d-md-block
        label-carousel">
          <h5>Slaide principal</h5>
          <p>Apresentação do primeiro slaide da pagina.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="img/img2.jpg" class="d-block w-100" alt="img2">
        <div class="carousel-caption d-none d-md-block
        label-carousel">
          <h5>Segundo slaide da pagina</h5>
          <p>Apresentação do segundo slaide da pagina.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="img/img3.jpg" class="d-block w-100" alt="img3">
        <div class="carousel-caption d-none d-md-block
        label-carousel">
          <h5>Terceiro slaide da pagina</h5>
          <p>Apresentação do terceiro slaide da pagina.</p>
        </div>
        </div>
        <div class="carousel-item">
            <img src="img/img4.jpg" class="d-block w-100" alt="img4">
            <div class="carousel-caption d-none d-md-block
            label-carousel">
              <h5>Quarto slide da pagina</h5>
              <p>Apresentação do quarto slaide da pagina.</p>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
<!--Fim do carrosel-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
