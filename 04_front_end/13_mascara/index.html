<form>
<div class "row">
    <!--nome-->
    <div claa="col-12 col-md-6 mb-5">
        <label class="form-label">Nome:</label>
        <input type="text" class="form-control" id="nome">
    </div>
    <!--email-->
    <div claa="col-12 col-md-6 mb-3">
        <label class="form-label">Email:</label>
        <input type="text" class="form-control" id="email">
    </div>
    <!--data de nascimento-->
    <div claa="col-12 col-md-4 mb-3">
        <label class="form-label">Data de nascimento:</label>

    <div claa="col-12 col-md-4 mb-3">
        <label class="form-label">CPF:</label>
        <input type="text" class="form-control" id="cpf">
    </div>
    <!--Telefone-->
    <div claa="col-12 col-md-4 mb-3">
        <label class="form-label">Telefone:</label>
        <input type="tel" class="form-control" id="telefone">
    </div>
    <!--Cep-->
    <div claa="col-12 col-md-3 mb-3">
        <label class="form-label">CEP:</label>
        <input type="text" class="form-control" id="cep">
    </div>
    <!--Endereço-->
    <div claa="col-12 col-md-9 mb-3">
        <label class="form-label">Endereço:</label>
        <input type="text" class="form-control" id="endereco">
    </div>

    <!--Botão-->
    <div class="d-flex justify-content-center mt-5 mb5">
        <button type="submit" class="btn-success">Enviar</button>
    </div>

</div>
</form>
